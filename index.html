<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex SIMS - Student Information Management System</title>
  <meta http-equiv="refresh" content="1;url=login.html">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .splash-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%);
      color: #ffffff;
      text-align: center;
      padding: 2rem;
    }
    .splash-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border-radius: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #fff;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      margin-bottom: 1.5rem;
      animation: pulseGlow 2s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 15px 35px rgba(56, 189, 248, 0.6); }
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <div class="splash-logo">
      <i class="bi bi-mortarboard-fill"></i>
    </div>
    <h1 class="display-6 fw-bold mb-1">Apex Institute of Technology</h1>
    <p class="text-white-50 mb-4" style="letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.85rem;">
      Student Information Management System (SIMS)
    </p>
    
    <div class="spinner-border text-info mb-3" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="small text-white-50">Initializing portal session...</p>
  </div>

  <script src="js/mock-data.js"></script>
  <script>
    // Route to dashboard if already logged in, otherwise login
    const current = window.SIMS.getCurrentStudent();
    setTimeout(() => {
      if (current) {
        window.location.replace('dashboard.html');
      } else {
        window.location.replace('login.html');
      }
    }, 400);
  </script>
</body>
</html>
